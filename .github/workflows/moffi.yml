name: Moffi Reservation

on:
  workflow_dispatch:

  schedule:
  #   - cron: '*/5 * * * *'
    - cron: '0 23 * * 1'
    - cron: '0 23 * * 3'
    # - cron: '22 0 * * 1'
    # - cron: '22 0 * * 3'
jobs:
  reserve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run bot
        env:
          MOFFI_EMAIL: ${{ secrets.MOFFI_EMAIL }}
          MOFFI_PASSWORD: ${{ secrets.MOFFI_PASSWORD }}
        run: node moffi.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
